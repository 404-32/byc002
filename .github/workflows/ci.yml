name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: MoonBit ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, js]
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
      - name: Update registry
        run: moon update
      - name: Check release metadata
        run: python scripts/check_release.py
      - name: Format
        run: moon fmt --check
      - name: Check
        run: moon check --target ${{ matrix.target }} --deny-warn
      - name: Test
        run: moon test --target ${{ matrix.target }} --deny-warn

  native:
    name: Native smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
      - name: Update registry
        run: moon update
      - name: Check native
        run: moon check --target native --deny-warn
      - name: Run example
        run: moon run cmd/gridlatch --target native -- analyze examples/branch_fault.json

  benchmark:
    name: Deterministic benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
      - name: Update registry
        run: moon update
      - name: Build JavaScript CLI
        run: moon build cmd/gridlatch --target js --release
      - name: Run 18-case benchmark
        run: >-
          python scripts/evaluate.py
          --bin _build/js/release/build/cmd/gridlatch/gridlatch.js
          --cases 18
          --out benchmark/ci-results.json
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: gridlatch-benchmark
          path: benchmark/ci-results.json
