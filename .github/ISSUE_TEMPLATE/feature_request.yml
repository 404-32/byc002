name: Feature request
description: Propose a tested compatibility-checking capability
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What release or API scenario is not handled?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Testable examples
      description: Provide base/head .mbti snippets and expected classification.
    validations:
      required: true
